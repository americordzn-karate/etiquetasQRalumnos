<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiqueta de alumno · Senshi-Kan</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eee;padding:12px;margin:0;color:#111}
main{max-width:540px;margin:auto;background:#fff;padding:18px;border-radius:12px}
h2{margin:0 0 10px;font-size:20px}h3{margin:16px 0 6px;font-size:15px}
button{width:100%;padding:15px;margin:6px 0;border:0;border-radius:8px;background:#222;color:#fff;font-size:17px}
button.sec{background:#555;font-size:14px;padding:10px}
button:disabled{background:#aaa}
#status{padding:12px;background:#eee;margin:10px 0;border-radius:8px;font-weight:bold}
#status.ok{background:#d9f5df}#status.err{background:#fbdcdc}
canvas{width:100%;border:1px solid #ccc;background:#fff}
label{display:block;font-size:13px;margin:8px 0 2px}
input[type=text],input[type=number],select{width:100%;padding:9px;font-size:15px;border:1px solid #bbb;border-radius:6px}
input[type=range]{width:100%}
.row{display:flex;gap:8px}.row>div{flex:1}
details{margin:10px 0;border:1px solid #ddd;border-radius:8px;padding:8px 10px}
summary{cursor:pointer;font-weight:bold;font-size:14px}
#log{background:#111;color:#00ff90;padding:10px;font:12px monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;border-radius:6px}
</style>
</head>
<body>
<main>
<h2>Etiqueta de alumno</h2>

<label>ID_Alumno (valor del QR)</label><input type="text" id="id">
<label>Nombre</label><input type="text" id="nombre">
<div class="row">
  <div><label>Copias</label><input type="number" id="copies" value="1" min="1" max="50"></div>
  <div></div>
</div>

<h3>Vista previa (50 × 30 mm)</h3>
<canvas id="preview" width="384" height="240"></canvas>

<button id="connect">1. Conectar impresora</button>
<button id="print" disabled>2. Imprimir etiqueta</button>
<div id="status">Desconectado</div>

<details>
<summary>Ajustes</summary>
<label>Desplazamiento horizontal: <b id="oxv">0</b> px (se recuerda en este teléfono)</label>
<input type="range" id="ox" min="-60" max="60" value="0">
<div class="row">
  <div><label>Densidad</label><select id="dens"><option value="4">Baja</option><option value="6">Normal</option><option value="10">Alta</option><option value="15">Máxima</option></select></div>
  <div><label>Alto de etiqueta (mm)</label><input type="number" id="hmm" value="30" min="10" max="100" step="0.5"></div>
</div>
<button id="clear" class="sec">Limpiar registro</button>
<button id="copyLog" class="sec">Copiar registro</button>
<div id="log"></div>
</details>
<button id="back" class="sec" style="margin-top:14px">← Volver a AppSheet</button>
</main>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

        });
        await this.chFC.startNotifications();
        for (let i = 0; i < 30 && this.credit < 0; i++) await sleep(50);
      }
      this.log("Conectado. créditos=" + this.credit + " MTU=" + this.fcMtu);
      return this.dev.name;
    }
    disconnect() { if (this.dev && this.dev.gatt.connected) this.dev.gatt.disconnect(); }

    async _writeRaw(bytes) {
      for (let t = 1; ; t++) { try { await this.chW.writeValueWithoutResponse(bytes); return; } catch (e) { if (t >= 3) throw e; await sleep(20); } }
    }
    async _send(data) {
      const fc = this.chFC && this.credit >= 0 && this.fcMtu > 0;
      const chunk = fc ? Math.min(this.fcMtu, 512) - 3 : 120;
      for (let sent = 0; sent < data.length;) {
        if (!this.dev.gatt.connected) throw new Error("Bluetooth desconectado durante el envío");
        if (fc) { let w = 0; while (this.credit <= 0) { if (w++ > 5000) throw new Error("Sin créditos de la impresora"); await sleep(1); } this.credit--; }
        const part = data.slice(sent, sent + chunk);
        try { await this._writeRaw(part); } catch (e) { if (fc) this.credit++; throw e; }
        sent += part.length; if (!fc) await sleep(10);
      }
      await sleep(50);
    }
    /** Consulta de solo lectura. Devuelve Uint8Array/array de datos o null si no hay respuesta. */
    async query(cmd, timeout = 1500) {
      this.rx = []; await this._writeRaw(Uint8Array.from(frame(cmd)));
      const end = Date.now() + timeout;
      while (Date.now() < end) {
        const { pk, rest } = parsePackages(this.rx); this.rx = rest;
        const hit = pk.find(p => p.cmd === cmd); if (hit) return hit.data; await sleep(30);
      }
      return null;
    }
    /** Información básica (no imprime ni avanza papel). */
    async identify() {
      const s = d => d ? String.fromCharCode(...d.filter(c => c >= 32 && c < 127)) : null;
      const st = await this.query(LP.IS_PRINTABLE);
      return { name: s(await this.query(LP.DEV_NAME)), software: s(await this.query(LP.SW_VER)),
        manufacturer: s(await this.query(LP.MANUF)), status: st ? st[0] : null, statusText: st ? (STATUS[st[0]] || "código " + st[0]) : "sin respuesta" };
    }
    async status() { const d = await this.query(LP.IS_PRINTABLE, 1200); return d ? d[0] : null; }
    async waitIdle(maxMs = 20000) {
      const end = Date.now() + maxMs; let last = null;
      while (Date.now() < end) { const s = await this.status(); if (s !== null) { last = s; if (s !== 1 && s !== 2) return s; } await sleep(350); }
      return last;
    }

    /**
     * Imprime un canvas (ancho 384 px). Lanza Error si la impresora no responde a LPAPI o tiene una falla
     * (sin papel, tapa abierta...), antes de enviar nada. Devuelve el estado final (0 = lista).
     */
    async printCanvas(cv, o = {}) {
      if (!this.connected) throw new Error("Impresora no conectada");
      if (this.busy) throw new Error("Hay una impresión en curso");
      if (cv.width !== HEAD_WIDTH) throw new Error("El canvas debe medir " + HEAD_WIDTH + " px de ancho (mide " + cv.width + ")");
      this.busy = true;
      try {
        if (o.verify !== false) {
          let st = await this.status();
          if (st === null) throw new Error("La impresora no respondió al protocolo LPAPI");
          if (st >= 20) throw new Error("Impresora no lista: " + (STATUS[st] || st));
          if (st === 1 || st === 2) await this.waitIdle(8000);
        }
        const rows = rasterize(cv, o.offsetX || 0, o.threshold || 128);
        const opts = { gapType: o.gapType ?? 2, gapLenMM: o.gapLenMM ?? 3, darkness: o.darkness ?? 6 };
        for (let c = 0; c < (o.copies || 1); c++) {
          await this._send(buildPage(rows, { ...opts, pageKey: (this.pageCounter++ % 65535) + 1 }));
          this.log("Página " + (c + 1) + " enviada");
        }
        await sleep(600);
        const fin = await this.waitIdle(20000);
        if (fin !== null && fin >= 20) throw new Error("Error de impresora: " + (STATUS[fin] || fin));
        return fin;
      } finally { this.busy = false; }
    }
  }

  /** Utilidad: canvas listo para la P2 (384 px de ancho, alto en mm), fondo blanco. */
  P2Printer.createCanvas = (heightMM = 30) => {
    const c = document.createElement("canvas"); c.width = HEAD_WIDTH; c.height = Math.round(heightMM * DOTS_PER_MM);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.fillStyle = "#000"; return c;
  };
  P2Printer.STATUS = STATUS;
  P2Printer._internals = { frame, encodeRows, buildPage, rasterize, parsePackages };   // para pruebas
  root.P2Printer = P2Printer;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const FONT = "Arial, Helvetica, sans-serif";

/* ---------- Medidas de la etiqueta de alumno (50 × 30 mm = 384 × 240 px) ---------- */
const QR_FRACTION   = 0.80;   // el QR ocupa el 80 % del alto de la etiqueta
const LOGO_FRACTION = 0.50;   // el logo ocupa el 50 % del alto de la etiqueta
const RIGHT_MARGIN  = 0;      // px entre el QR y el borde derecho (0 = pegado a la derecha)
const LOGO_GAP      = 8;      // px mínimos entre el logo y el QR
const NAME_GAP      = 4;      // px entre el QR y el nombre
const EDGE = 4;              // px de margen de seguridad arriba y abajo
const NAME_MAX = 26, NAME_MIN = 10;   // tamaño de letra del nombre (se ajusta solo)
// Dirección de su app de AppSheet. También puede enviarse en la URL con &volver=...
const APPSHEET_URL = "https://www.appsheet.com/start/ebc837fc-900c-4559-ba3e-ca02b965e134";

/* ---------- Dibujo ---------- */
const canvas = $("preview"), ctx = canvas.getContext("2d");
let logoImg = null;

function wrap(text, font, maxW, maxLines) {
  ctx.font = font; const words = text.split(" ").filter(Boolean), lines = []; let cur = "";
  for (const w of words) {
    if (ctx.measureText(w).width > maxW) return null;          // una palabra no cabe: reducir tamaño
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines.length <= maxLines ? lines : null;
}
const capH = font => { ctx.font = font; return ctx.measureText("H").actualBoundingBoxAscent; };
function truncate(text, font, maxW) {                          // último recurso: una línea con "…"
  ctx.font = font; let s = text;
  while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
  return s + "…";
}

function drawQR(data, S, x, y) {
  const qr = qrcode(0, "M"); qr.addData(data); qr.make();
  const n = qr.getModuleCount();
  ctx.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) {
    const x0 = Math.round(c * S / n), x1 = Math.round((c + 1) * S / n), y0 = Math.round(r * S / n), y1 = Math.round((r + 1) * S / n);
    ctx.fillRect(x + x0, y + y0, x1 - x0, y1 - y0);
  }
}

function drawLabel() {
  const W = 384, H = Math.max(8, Math.round(parseFloat($("hmm").value) * 203 / 25.4));
  if (canvas.height !== H) canvas.height = H;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const id = $("id").value.trim(), nombre = $("nombre").value.trim().replace(/\s+/g, " ");

  const S = Math.round(H * QR_FRACTION), qx = W - S - RIGHT_MARGIN, cx = qx + S / 2;   // QR y nombre: a la derecha

  // Nombre en negritas, centrado bajo el QR; máximo 2 líneas dentro del ancho del QR. Se busca la letra más grande que cabe.
  let fit = null;
  for (let f = NAME_MAX; f >= NAME_MIN && nombre; f--) {
    const font = `bold ${f}px ${FONT}`, lines = wrap(nombre, font, S, 2);
    if (!lines) continue;
    const pitch = Math.round(f * 1.15), nameH = (lines.length - 1) * pitch + capH(font) + Math.ceil(f * 0.25), total = S + NAME_GAP + nameH;   // incluye la cola de letras como p, g, y
    if (total <= H - 2 * EDGE) { fit = { font, lines, pitch, nameH, total }; break; }
  }
  if (!fit && nombre) {
    const font = `bold ${NAME_MIN}px ${FONT}`, nameH = capH(font) + Math.ceil(NAME_MIN * 0.25);
    fit = { font, lines: [truncate(nombre, font, S)], pitch: 0, nameH, total: S + NAME_GAP + nameH };
  }
  const total = fit ? fit.total : S, top = Math.round((H - total) / 2);

  if (id) drawQR(id, S, qx, top);
  if (fit) {
    ctx.fillStyle = "#000"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.font = fit.font;
    const base = top + S + NAME_GAP + capH(fit.font);
    fit.lines.forEach((ln, i) => ctx.fillText(ln, cx, base + i * fit.pitch));
  }

  // Logo a la izquierda: 50 % del alto, centrado verticalmente, sin deformarse
  if (logoImg) {
    const Lh = Math.round(H * LOGO_FRACTION), maxW = qx - LOGO_GAP;
    const k = Math.min(Lh / logoImg.height, maxW / logoImg.width), lw = Math.round(logoImg.width * k), lh = Math.round(logoImg.height * k);
    ctx.drawImage(logoImg, 0, Math.round((H - lh) / 2), lw, lh);
  }
}

/* ---------- Ajustes recordados (los mismos que la página de inventario) ---------- */
const store = { get(k, d) { try { const v = localStorage.getItem("p2_" + k); return v === null ? d : v; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("p2_" + k, v); } catch (e) {} } };

/* ---------- Impresión ---------- */
const printer = new P2Printer({
  log: s => { const l = $("log"); l.textContent += "[" + new Date().toLocaleTimeString() + "] " + s + "\n"; l.scrollTop = l.scrollHeight; },
  onDisconnect: () => { $("print").disabled = true; $("connect").disabled = false; status("Desconectado", "err"); }
});
function status(s, cls = "") { $("status").textContent = s; $("status").className = cls; }

$("connect").onclick = async () => {
  try { $("connect").disabled = true; status("Buscando impresora..."); await printer.connect();
        status("Conectado a " + printer.dev.name, "ok"); $("print").disabled = false; }
  catch (e) { status("Error de conexión: " + e.message, "err"); $("connect").disabled = false; }
};
$("print").onclick = async () => {
  $("print").disabled = true;
  try {
    if (!$("id").value.trim()) throw new Error("Falta el ID_Alumno");
    drawLabel(); status("Imprimiendo...");
    await printer.printCanvas(canvas, { copies: Math.max(1, parseInt($("copies").value) || 1), offsetX: parseInt($("ox").value),
                                        darkness: parseInt($("dens").value), gapType: 2, gapLenMM: 3 });
    status("Etiqueta impresa ✔", "ok");
  } catch (e) { status("Error: " + e.message, "err"); }
  finally { $("print").disabled = !printer.connected; }
};

/* ---------- Eventos y arranque ---------- */
["id", "nombre", "hmm"].forEach(id => $(id).addEventListener("input", drawLabel));
$("ox").addEventListener("input", () => { $("oxv").textContent = $("ox").value; store.set("ox", $("ox").value); });
$("dens").addEventListener("change", () => store.set("dens", $("dens").value));
$("back").onclick = () => {
  const dest = new URLSearchParams(location.search).get("volver") || APPSHEET_URL;
  if (dest) { location.href = dest; return; }
  if (history.length > 1) { history.back(); return; }
  window.close(); status("Cierre esta pestaña para volver a AppSheet", "err");
};
$("clear").onclick = () => { $("log").textContent = ""; };
$("copyLog").onclick = async () => { try { await navigator.clipboard.writeText($("log").textContent); status("Registro copiado", "ok"); } catch (e) {} };

const q = new URLSearchParams(location.search);
$("id").value = q.get("id") || "";
$("nombre").value = q.get("nombre") || "";
if (q.get("copias")) $("copies").value = q.get("copias");
$("ox").value = store.get("ox", "0"); $("oxv").textContent = $("ox").value; $("dens").value = store.get("dens", "6");

drawLabel();
const logo = new Image();
logo.onload = () => { logoImg = logo; drawLabel(); };
logo.onerror = () => { logoImg = null; };
logo.src = q.get("logo") || "logo.png";                    // logo de Senshi-Kan junto a esta página
if (!P2Printer.supported) { status("Abra esta página en Chrome (Android) con HTTPS", "err"); $("connect").disabled = true; }
</script>
</body>
